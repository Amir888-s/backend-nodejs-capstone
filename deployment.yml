apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-chance-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: second-chance-api
  template:
    metadata:
      labels:
        app: second-chance-api
    spec:
      containers:
        - name: api
          image: us.icr.io/YOUR_NAMESPACE/second-chance:latest
          ports:
            - containerPort: 3000
          env:
            - name: MONGO_URL
              value: mongodb://mongo:27017
            - name: MONGO_DB
              value: secondChanceDB
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: second-chance-secrets
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: second-chance-api
spec:
  selector:
    app: second-chance-api
  ports:
    - port: 80
      targetPort: 3000
