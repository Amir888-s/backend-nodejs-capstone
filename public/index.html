<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Second Chance Marketplace</title>
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#18332c;background:#f5fbf8}
    main{min-height:100vh;display:grid;place-items:center;padding:2rem}
    .hero{max-width:850px;text-align:center;background:white;padding:5rem 3rem;border-radius:28px;box-shadow:0 20px 60px #164f3420}
    .badge{color:#087f5b;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    h1{font-size:clamp(2.6rem,7vw,5.5rem);line-height:1;margin:.5rem 0 1.25rem}
    p{font-size:1.25rem;line-height:1.6;color:#46635b}
    a{display:inline-block;margin-top:1.5rem;padding:1rem 1.6rem;border-radius:999px;background:#087f5b;color:white;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main><section class="hero">
    <div class="badge">Reuse · Share · Sustain</div>
    <h1>Second Chance</h1>
    <p>Give useful items a new home. Discover affordable products, reduce waste, and connect with your community.</p>
    <a href="/api/secondchance/items">Get Started</a>
  </section></main>
</body>
</html>
